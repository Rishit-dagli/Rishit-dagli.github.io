<footer class="site-footer">
  <div class="wrapper">
    <div class="footer-content">
      <div class="social-links">
        {% if site.twitter_username %}
        <a href="https://twitter.com/{{ site.twitter_username }}" target="_blank" rel="noopener">X / Twitter</a>
        {% endif %}
        {% if site.email %}
        <a href="mailto:{{ site.email }}">Email</a>
        {% endif %}
      </div>
    </div>
  </div>
</footer>
