<figure class="image" {% if include.id %}id="{{ include.id }}"{% endif %}>
    {% if include.dark_url %}
        <!-- Dual theme images -->
        <img src="{{ include.url }}" 
             alt="{{ include.description }}" 
             loading="lazy"
             decoding="async"
             class="theme-image light-only">
        <img src="{{ include.dark_url }}" 
             alt="{{ include.description }}" 
             loading="lazy"
             decoding="async"
             class="theme-image dark-only">
    {% else %}
        <!-- Single theme image -->
        <img src="{{ include.url }}" alt="{{ include.description }}" loading="lazy" decoding="async">
    {% endif %}
    <figcaption>{{ include.description }}</figcaption>
</figure>
