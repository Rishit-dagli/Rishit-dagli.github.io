<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- SIGGRAPH-inspired CSS -->
  <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
  
  <!-- Theme toggle script (loads early to prevent flash) -->
  <script src="{{ "/assets/js/theme-toggle.js" | relative_url }}"></script>
  <script defer src="{{ "/assets/js/accessibility.js" | relative_url }}"></script>

  {% if page.layout == "post" %}
  <!-- Collapsible TOC script -->
  <script src="{{ "/assets/js/collapsible-toc.js" | relative_url }}"></script>
  
  <!-- Sidenotes: footnotes in the right margin, or expandable inline -->
  <script defer src="{{ "/assets/js/sidenotes.js" | relative_url }}"></script>

  <!-- Sidebar TOC: active section tracking + header/footer clamping -->
  <script src="{{ "/assets/js/sidebar-toc.js" | relative_url }}"></script>
  
  <!-- Figure references script -->
  <script src="{{ "/assets/js/figure-refs.js" | relative_url }}"></script>
  {% endif %}
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="{{ "/favicon.ico" | relative_url }}">
  
  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ "/feed.xml" | relative_url }}">

  {% if page.layout == "post" and page.math != false %}
  <!-- MathJax with automatic equation numbering and color support -->
  <script>
  window.MathJax = {
    tex: {
      tags: 'ams',
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true,
      processEnvironments: true,
      packages: {'[+]': ['color', 'colorv2']}
    },
    options: {
      ignoreHtmlClass: 'tex2jax_ignore',
      processHtmlClass: 'tex2jax_process'
    },
    loader: {
      load: ['[tex]/color', '[tex]/colorv2']
    }
  };
  </script>
  <script id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  </script>
  {% endif %}

  <!-- SEO -->
  {% seo %}

  {% if jekyll.environment == "production" and site.google_analytics %}
  <!-- Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { window.dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
  {% endif %}
</head>
