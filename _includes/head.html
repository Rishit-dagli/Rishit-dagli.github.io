<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% if page.layout == "post" and page.math != false %}
  <!-- KaTeX output is generated at build time; this provides its layout and fonts. -->
  <link rel="stylesheet" href="{{ "/assets/katex/katex.min.css" | relative_url }}">
  {% endif %}

  <!-- SIGGRAPH-inspired CSS -->
  <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
  
  <!-- Theme toggle script (loads early to prevent flash) -->
  <script src="{{ "/assets/js/theme-toggle.js" | relative_url }}"></script>

  {% if page.layout == "post" %}
  <!-- Collapsible TOC script -->
  <script src="{{ "/assets/js/collapsible-toc.js" | relative_url }}"></script>
  
  <!-- Footnote tooltips script -->
  <script src="{{ "/assets/js/footnote-tooltips.js" | relative_url }}"></script>

  <!-- Sidebar TOC: active section tracking + header/footer clamping -->
  <script src="{{ "/assets/js/sidebar-toc.js" | relative_url }}"></script>
  
  <!-- Figure references script -->
  <script src="{{ "/assets/js/figure-refs.js" | relative_url }}"></script>
  {% endif %}
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="{{ "/favicon.ico" | relative_url }}">
  
  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ "/feed.xml" | relative_url }}">
  
  <!-- SEO -->
  {% seo %}

  {% if jekyll.environment == "production" and site.google_analytics %}
  <!-- Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { window.dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
  {% endif %}
</head>
